<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f2ed"><title>Pause attention</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#e8f2ed;color:#173b31;margin:0;padding:20px;min-height:100dvh;display:grid;place-items:center}main{width:min(100%,430px);background:white;padding:24px;border-radius:22px;box-shadow:0 8px 28px #164a3420}h1{margin:0 0 8px}p{line-height:1.5;color:#45655b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.tile{background:#f6faf8;border:2px solid #dfeae3;border-radius:14px;min-height:95px;font-size:35px;cursor:pointer}.tile span{display:block;font-size:12px;color:#33564a;margin-top:5px}.selected{background:#def1e5;border-color:#236d53}button{font:inherit}button:focus-visible{outline:3px solid #236d53;outline-offset:2px}.action{width:100%;border:0;border-radius:12px;padding:14px;margin-top:8px;background:#236d53;color:white;font-weight:600}.action:disabled{opacity:.45}.secondary{background:#eef5f0;color:#236d53}.small{font-size:13px}#finish{display:none}</style></head><body><main><section id="game"><h1>🌿 Pause attention</h1><p class="small">Une petite pause sans chrono, sans pression et sans son.</p><p id="progress"></p><h2 id="question"></h2><div id="tiles" class="grid"></div><p id="status" aria-live="polite"></p><button id="next" class="action" disabled>Continuer</button><button id="stop" class="action secondary">Terminer maintenant</button></section><section id="finish"><h1>Pause terminée 🌱</h1><p>Tu peux reprendre à ton rythme.</p><button id="restart" class="action">Refaire une pause</button><button id="share" class="action secondary">Prévenir mon ami (facultatif)</button><p class="small">Aucun suivi. Le partage nécessite ton choix et ton action.</p></section></main><script>const rounds=[{q:"Trouve les trois aliments",a:[["🍓","Fraise",1],["🚲","Vélo",0],["🥑","Avocat",1],["📚","Livres",0],["🍋","Citron",1],["🎸","Guitare",0]]},{q:"Trouve les trois éléments naturels",a:[["🌳","Arbre",1],["⌚","Montre",0],["🌻","Fleur",1],["🛋️","Canapé",0],["🏔️","Montagne",1],["💻","Ordinateur",0]]},{q:"Trouve les trois transports",a:[["🚆","Train",1],["🐱","Chat",0],["🚲","Vélo",1],["🍐","Poire",0],["🚢","Bateau",1],["🎨","Peinture",0]]},{q:"Trouve les trois sources de lumière",a:[["🔦","Lampe",1],["🪑","Chaise",0],["🕯️","Bougie",1],["🧸","Peluche",0],["💡","Ampoule",1],["🍞","Pain",0]]}];let order=[],step=0,selected=new Set();const el=id=>document.getElementById(id);function start(){order=rounds.map(r=>({...r,a:[...r.a].sort(()=>Math.random()-.5)})).sort(()=>Math.random()-.5);step=0;el("finish").style.display="none";el("game").style.display="block";render()}function render(){selected.clear();el("progress").textContent="Étape "+(step+1)+" sur "+order.length;el("question").textContent=order[step].q;el("status").textContent="";el("next").disabled=true;el("tiles").replaceChildren();order[step].a.forEach(([emoji,label],i)=>{const b=document.createElement("button");b.className="tile";b.type="button";b.setAttribute("aria-pressed","false");b.append(document.createTextNode(emoji));const s=document.createElement("span");s.textContent=label;b.append(s);b.onclick=()=>{if(selected.has(i))selected.delete(i);else if(selected.size<3)selected.add(i);document.querySelectorAll(".tile").forEach((t,j)=>{t.classList.toggle("selected",selected.has(j));t.setAttribute("aria-pressed",String(selected.has(j)))});el("next").disabled=selected.size!==3};el("tiles").append(b)})}function finish(){el("game").style.display="none";el("finish").style.display="block"}el("next").onclick=()=>{if(![...selected].every(i=>order[step].a[i][2])){el("status").textContent="Tu peux réessayer tranquillement.";return}step++;step===order.length?finish():render()};el("stop").onclick=finish;el("restart").onclick=start;el("share").onclick=async()=>{const msg="Je viens de prendre un petit moment pour moi 🌿";if(navigator.share){try{await navigator.share({text:msg})}catch(e){}}else{try{await navigator.clipboard.writeText(msg);alert("Message copié, à envoyer si tu le souhaites.")}catch(e){alert(msg)}}};start();</script></body></html>
